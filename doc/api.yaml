openapi: 3.0.3
info:
  title: WASAText
  version: 1.0.0
  description: API for WASAText instant messaging application.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /session:
    post:
      tags:
        - login
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: "^.*?$"
                  minLength: 3
                  maxLength: 16
              required:
                - name
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"

  /users/me/name:
    put:
      tags:
        - users
      summary: Set my username
      operationId: setMyUserName
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 16
              required:
                - name
      responses:
        '204':
          description: Username updated successfully
        '400':
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/photo:
    put:
      tags:
        - users
      summary: Set my profile photo
      operationId: setMyPhoto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Photo updated successfully

  /users:
    get:
      tags:
        - users
      summary: Search for users
      operationId: searchUsers
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Username query string
          schema:
            type: string
      responses:
        '200':
          description: List of users matching the query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /conversations:
    get:
      tags:
        - conversations
      summary: Get my conversations
      description: Returns a list of conversations sorted in reverse chronological order.
      operationId: getMyConversations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationUnread'

    post:
      tags:
        - conversations
      summary: Create a new conversation (group)
      operationId: createConversation
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Group name (required for groups)
                members:
                  type: array
                  items:
                    type: string
                  description: Initial members (optional)
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - conversations
      summary: Get a conversation
      description: Get conversation details and messages.
      operationId: getConversation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Conversation details and messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/name:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - conversations
      summary: Set group name
      operationId: setGroupName
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
              required:
                - name
      responses:
        '204':
          description: Group name updated
        '403':
          description: Not allowed (not a group or not a member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/photo:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - conversations
      summary: Set group photo
      operationId: setGroupPhoto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Group photo updated
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/members/{userId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - conversations
      summary: Add a user to a group
      operationId: addToGroup
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User added to group
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User or conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/members/me:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - conversations
      summary: Leave a group
      operationId: leaveGroup
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Left group successfully

  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - messages
      summary: Send or forward a message
      operationId: sendMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/NewTextMessage'
                - $ref: '#/components/schemas/NewPhotoMessage'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /conversations/{conversationId}/messages/forwarded:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
          - messages
      summary: Forward a message
      operationId: forwardMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forwardedMessageId:
                  type: string
              required:
                - forwardedMessageId
      responses:
        '201':
          description: Message forwarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - messages
      summary: Delete a message
      operationId: deleteMessage
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Message deleted

  /conversations/{conversationId}/messages/{messageId}/reactions:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - reactions
      summary: React to a message (comment)
      operationId: commentMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
              required:
                - emoji
      responses:
        '201':
          description: Reaction added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'

  /conversations/{conversationId}/messages/{messageId}/reactions/{reactionId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
      - name: reactionId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - reactions
      summary: Remove a reaction (uncomment)
      operationId: uncommentMessage
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Reaction removed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    User:
      type: object
      description: API User model
      properties:
        id:
          type: integer
          format: int64
          description: User unique identifier
        username:
          type: string
          description: Unique username
          minLength: 3
          maxLength: 16
          pattern: "^[a-zA-Z0-9_]{3,16}$"
        photo:
          type: string
          format: byte
          nullable: true
          description: Base64 encoded profile photo (optional)
      required:
        - username


    Error:
      type: object
      description: Standard error response
      properties:
        code:
          type: string
          description: Error code identifier
          minLength: 1
          maxLength: 50
          pattern: "^[A-Z_]{1,50}$"
        message:
          type: string
          description: Human readable error message
          minLength: 1
          maxLength: 200
          pattern: "^.{1,200}$"

    ConversationUnread:
      type: object
      description: Conversation summary for list view
      properties:
        id:
          type: string
          description: Conversation unique identifier
        name:
          type: string
          nullable: true
          description: Group name (if group)
          maxLength: 64
        isGroup:
          type: boolean
          description: Whether this is a group conversation
        photo:
          type: string
          format: byte
          nullable: true
          description: Conversation photo
        lastMessage:
          $ref: '#/components/schemas/Message'
        unreadCount:
          type: integer
          description: Number of unread messages

    ConversationDetails:
      type: object
      description: Full conversation details
      properties:
        id:
          type: string
          description: Conversation ID
        name:
          type: string
          nullable: true
          description: Group name
        isGroup:
          type: boolean
          description: Is this a group?
        ownerId:
          type: string
          description: Owner User ID (if group)
        members:
          type: array
          description: List of members
          items:
            $ref: '#/components/schemas/User'
        messages:
          type: array
          description: List of messages
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Message'
      required:
        - messages

    Message:
      type: object
      description: A message in a conversation
      properties:
        id:
          type: string
          description: Message ID
        conversationId:
          type: string
          description: Conversation ID this message belongs to
        senderId:
          type: string
          description: ID of the user who sent the message
        content:
          type: string
          description: Text content of the message
          minLength: 1
          maxLength: 2048

          pattern: "^.{1,2048}$"
        photo:
          type: string
          format: byte
          nullable: true
          description: Base64 encoded photo (if type is image)
        type:
          type: string
          description: Message type (text or image)
          enum: [text, image]
        timestamp:
          type: string
          format: date-time
          description: ISO8601 timestamp
        received:
          type: boolean
          description: True if received by recipient
        read:
          type: boolean
          description: True if read by recipient
        reactions:
          type: array
          description: List of reactions
          items:
            $ref: '#/components/schemas/Reaction'

    NewTextMessage:
      type: object
      description: Payload for sending a text message
      properties:
        type:
          type: string
          enum: [text]
          description: Must be 'text'
        content:
          type: string
          description: The message text content
          minLength: 1
          maxLength: 2048

    NewPhotoMessage:
      type: object
      description: Payload for sending a photo message
      properties:
        type:
          type: string
          enum: [image]
          description: Must be 'image'
        image:
          type: string
          format: binary
          description: The photo image data

    Reaction:
      type: object
      description: A reaction to a message
      properties:
        id:
          type: string
          description: Reaction ID
        userId:
          type: string
          description: User who reacted
        emoji:
          type: string
          description: The emoji character
          minLength: 1
          maxLength: 2
          pattern: "^(\\u00a9|\\u00ae|[\\u2000-\\u3300]|\\ud83c[\\ud000-\\udfff]|\\ud83d[\\ud000-\\udfff]|\\ud83e[\\ud000-\\udfff])$"

