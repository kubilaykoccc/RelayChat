openapi: 3.0.3
info:
  title: WASAText
  version: 1.0.0
  description: API for WASAText instant messaging application.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: login
    description: Login and session management
  - name: users
    description: User management
  - name: conversations
    description: Conversation management
  - name: messages
    description: Message handling
   - name: reactions
    description: Reaction handling
tags:
  - name: login
    description: Login related operations
  - name: users
    description: User related operations
  - name: conversations
    description: Conversation related operations
  - name: messages
    description: Message related operations
  - name: reactions
    description: Reaction related operations
paths:
  /session:
    post:
      tags:
        - login
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details for login
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Login payload
              properties:
                name:
                  type: string
                  description: Username to login with
                  example: Maria
                  pattern: "^[a-z0-9]+$"
                  minLength: 3
                  maxLength: 16
              required:
                - name
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                description: Login response containing user identifier
                properties:
                  identifier:
                    type: string
                    description: The user unique identifier
                    example: "abcdef012345"
                    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
                    minLength: 36
                    maxLength: 36

  /users/me/name:
    put:
      tags:
        - users
      summary: Set my username
      description: Update the authenticated user's username.
      operationId: setMyUserName
      security:
        - BearerAuth: []
      requestBody:
        description: New username
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 16
                  pattern: "^[a-zA-Z0-9_]{3,16}$"
              required:
                - name
      responses:
        '204':
          description: Username updated successfully
        '400':
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/photo:
    put:
      tags:
        - users
      summary: Set my profile photo
      description: Update the authenticated user's profile photo.
      operationId: setMyPhoto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Photo updated successfully

  /users:
    get:
      tags:
        - users
      summary: Search for users
      description: Search for other users by username substring.
      operationId: searchUsers
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Username query string
          schema:
            type: string
      responses:
        '200':
          description: List of users matching the query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /conversations:
    get:
      tags:
        - conversations
      summary: Get my conversations
      description: Returns a list of conversations sorted in reverse chronological order.
      operationId: getMyConversations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationUnread'

    post:
      tags:
        - conversations
      summary: Create a new conversation (group)
      description: Create a new group conversation or start a direct chat.
      operationId: createConversation
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Group name (required for groups)
                  maxLength: 64
                  minLength: 1
                members:
                  type: array
                  items:
                    type: string
                    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
                    minLength: 36
                    maxLength: 36
                  description: Initial members (optional)
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    get:
      tags:
        - conversations
      summary: Get a conversation
      description: Get conversation details and messages.
      operationId: getConversation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Conversation details and messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/name:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    put:
      tags:
        - conversations
      summary: Set group name
      description: Update the name of a group conversation.
      operationId: setGroupName
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: "^.{1,64}$"
              required:
                - name
      responses:
        '204':
          description: Group name updated
        '403':
          description: Not allowed (not a group or not a member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/photo:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    put:
      tags:
        - conversations
      summary: Set group photo
      description: Update the photo of a group conversation.
      operationId: setGroupPhoto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Group photo updated
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/members/{userId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: userId
        in: path
        required: true
        description: User unique identifier to add
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          minLength: 36
          maxLength: 36
    put:
      tags:
        - conversations
      summary: Add a user to a group
      description: Add a user to an existing group conversation.
      operationId: addToGroup
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User added to group
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User or conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/members/me:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    delete:
      tags:
        - conversations
      summary: Leave a group
      description: Remove self from a group conversation.
      operationId: leaveGroup
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Left group successfully

  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    post:
      tags:
        - messages
      summary: Send or forward a message
      description: Send a new text or photo message to the conversation.
      operationId: sendMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/NewTextMessage'
                - $ref: '#/components/schemas/NewPhotoMessage'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /conversations/{conversationId}/messages/forwarded:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    post:
      tags:
          - messages
      summary: Forward a message
      description: Forward an existing message to this conversation.
      operationId: forwardMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forwardedMessageId:
                  type: string
                  pattern: "^[a-zA-Z0-9-]+$"
                  minLength: 1
                  maxLength: 64
              required:
                - forwardedMessageId
      responses:
        '201':
          description: Message forwarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: messageId
        in: path
        required: true
        description: Message unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    delete:
      tags:
        - messages
      summary: Delete a message
      description: Delete a message from the conversation.
      operationId: deleteMessage
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Message deleted

  /conversations/{conversationId}/messages/{messageId}/reactions:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: messageId
        in: path
        required: true
        description: Message unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    post:
      tags:
        - reactions
      summary: React to a message (comment)
      description: Add a reaction emoji to a message.
      operationId: commentMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  minLength: 1
                  maxLength: 2
                  pattern: "^(\\u00a9|\\u00ae|[\\u2000-\\u3300]|\\ud83c[\\ud000-\\udfff]|\\ud83d[\\ud000-\\udfff]|\\ud83e[\\ud000-\\udfff])$"
              required:
                - emoji
      responses:
        '201':
          description: Reaction added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'

  /conversations/{conversationId}/messages/{messageId}/reactions/{reactionId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: messageId
        in: path
        required: true
        description: Message unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: reactionId
        in: path
        required: true
        description: Reaction unique identifier
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
    delete:
      tags:
        - reactions
      summary: Remove a reaction (uncomment)
      description: Remove a reaction from a message.
      operationId: uncommentMessage
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Reaction removed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    User:
      type: object
      description: API User model representing a registered user.
      properties:
        id:
          type: string
          description: User unique identifier (UUID format).
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          minLength: 36
          maxLength: 36
        username:
          type: string
          description: Unique username for display and login.
          minLength: 3
          maxLength: 16
          pattern: "^[a-zA-Z0-9_]{3,16}$"
        photo:
          type: string
          format: byte
          description: Base64 encoded profile photo (optional).
          minLength: 0
          maxLength: 5242880 # 5MB approx
      required:
        - username
        - id


    Error:
      type: object
      description: Standard error response structure.
      properties:
        code:
          type: string
          description: Machine-readable error code identifier.
          minLength: 1
          maxLength: 50
          pattern: "^[A-Z_]{1,50}$"
        message:
          type: string
          description: Human readable error message describing what went wrong.
          minLength: 1
          maxLength: 200
          pattern: "^.{1,200}$"

    ConversationUnread:
      type: object
      description: Conversation summary structure used in list views, containing unread counts.
      properties:
        id:
          type: string
          description: Conversation unique identifier.
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
        name:
          type: string
          description: Group name (if group), otherwise empty or ignored.
          minLength: 0
          maxLength: 64
        isGroup:
          type: boolean
          description: Boolean flag indicating if this is a group conversation.
        photo:
          type: string
          format: byte
          description: Base64 encoded conversation photo (optional).
          minLength: 0
          maxLength: 5242880
        lastMessage:
          $ref: '#/components/schemas/Message'
        unreadCount:
          type: integer
          description: Count of messages not yet read by the user in this conversation.
          minimum: 0

    ConversationDetails:
      type: object
      description: Detailed conversation object including members and messages.
      properties:
        id:
          type: string
          description: Conversation unique identifier.
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
        name:
          type: string
          description: Group name (if group).
          minLength: 0
          maxLength: 64
        isGroup:
          type: boolean
          description: Boolean flag indicating if this is a group conversation.
        ownerId:
          type: string
          description: User ID of the group owner (if group).
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          minLength: 36
          maxLength: 36
        members:
          type: array
          description: List of users participating in the conversation.
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/User'
        messages:
          type: array
          description: List of the most recent messages in the conversation.
          minItems: 0
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Message'
      required:
        - messages

    Message:
      type: object
      description: Represents a single message within a conversation.
      properties:
        id:
          type: string
          description: Unique message identifier.
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
        conversationId:
          type: string
          description: ID of the conversation this message belongs to.
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
        senderId:
          type: string
          description: User ID of the sender.
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          minLength: 36
          maxLength: 36
        content:
          type: string
          description: Text content of the message.
          minLength: 0
          maxLength: 2048
        photo:
          type: string
          format: byte
          description: Base64 encoded photo data (if type is image).
          minLength: 0
          maxLength: 10485760 # 10MB
        type:
          type: string
          description: Type of the message (text or image).
          enum: [text, image]
        timestamp:
          type: string
          format: date-time
          description: ISO8601 formatted timestamp of when the message was sent.
        received:
          type: boolean
          description: Status flag indicating if the message was received.
        read:
          type: boolean
          description: Status flag indicating if the message was read.
        reactions:
          type: array
          description: List of reactions (emojis) added to this message.
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Reaction'

    NewTextMessage:
      type: object
      description: Request payload for sending a new text message.
      properties:
        type:
          type: string
          enum: [text]
          description: Message type discriminator (must be 'text').
        content:
          type: string
          description: The text body of the message.
          minLength: 1
          maxLength: 2048

    NewPhotoMessage:
      type: object
      description: Request payload for sending a new photo message.
      properties:
        type:
          type: string
          enum: [image]
          description: Message type discriminator (must be 'image').
        image:
          type: string
          format: binary
          description: Binary image data to upload.

    Reaction:
      type: object
      description: Represents a user reaction to a a message.
      properties:
        id:
          type: string
          description: Unique reaction identifier.
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 1
          maxLength: 64
        userId:
          type: string
          description: User ID of the person who reacted.
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          minLength: 36
          maxLength: 36
        emoji:
          type: string
          description: The emoji character used for reaction.
          minLength: 1
          maxLength: 10
          description: The emoji character
          minLength: 1
          maxLength: 2
          pattern: "^(\\u00a9|\\u00ae|[\\u2000-\\u3300]|\\ud83c[\\ud000-\\udfff]|\\ud83d[\\ud000-\\udfff]|\\ud83e[\\ud000-\\udfff])$"

