openapi: 3.0.3
info:
  title: WASAText API
  description: API for the WASAText messaging application
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID

  parameters:
    groupId:
      name: groupId
      in: path
      description: Unique identifier of the group
      required: true
      schema:
        type: string
        format: uuid
        description: Unique Identifier of the group
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        minLength: 36
        maxLength: 36

  schemas:
    Conversation:
      type: object
      description: A conversation between users
      required:
        - type
      properties:
        id:
          type: string
          format: uuid
          description: Unique conversation identifier
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
        name:
          type: string
          description: Display name
          pattern: "^.{1,50}$"
          minLength: 1
          maxLength: 50
        type:
          type: string
          description: Conversation type
          enum:
            - individual
            - group
          minLength: 1
          maxLength: 20
        lastMessage:
          type: object
          description: Most recent message preview
          required:
            - type
          properties:
            content:
              type: string
              description: Message preview text
              pattern: "^.{1,100}$"
              minLength: 1
              maxLength: 100
            timestamp:
              type: string
              format: date-time
              description: Message timestamp
              minLength: 1
              maxLength: 100
            type:
              type: string
              description: Message type
              enum:
                - text
                - photo
              minLength: 1
              maxLength: 10

    Error:
      type: object
      description: Standard error response
      properties:
        code:
          type: string
          description: Error code identifier
          pattern: "^[A-Z_]{1,50}$"
          minLength: 1
          maxLength: 50
        message:
          type: string
          description: Human readable error message
          pattern: "^.{1,200}$"
          minLength: 1
          maxLength: 200

    Message:
      type: object
      description: A message within a conversation
      required:
        - type
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique message identifier
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
        conversationId:
          type: string
          format: uuid
          description: Unique conversation identifier
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
        sender:
          type: string
          description: Username of sender
          pattern: "^[a-zA-Z0-9_]{3,16}$"
          minLength: 3
          maxLength: 16
        content:
          type: string
          description: Message content or photo URL
          pattern: "^.{1,1000}$"
          minLength: 1
          maxLength: 1000
        type:
          type: string
          description: Content type of message
          enum:
            - text
            - photo
          minLength: 1
          maxLength: 10
        status:
          type: string
          description: Message delivery status
          enum:
            - sent
            - received
            - read
          minLength: 1
          maxLength: 10
        timestamp:
          type: string
          format: date-time
          description: Message creation time
          minLength: 1
          maxLength: 100

    Reaction:
      type: object
      description: An emoji reaction to a message
      properties:
        emoji:
          type: string
          description: Emoji reaction
          pattern: '(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])'
          minLength: 1
          maxLength: 2
        userId:
          type: string
          description: User identifier who reacted
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
        username:
          type: string
          description: Username of reactor
          pattern: "^[a-zA-Z0-9_]{3,16}$"
          minLength: 3
          maxLength: 16

tags:
  - name: Login
    description: User authentication endpoints
  - name: User
    description: User management endpoints
  - name: Conversations
    description: Conversation management endpoints
  - name: Messages
    description: Message handling endpoints
  - name: Groups
    description: Group management endpoints
  - name: System
    description: System status endpoints

paths:
  /session:
    post:
      tags:
        - Login
      summary: Login or register user
      description: |
        Authenticate existing user.
        If user does not exist, it will be created and an identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              type: object
              description: User login details
              required:
                - name
              properties:
                name:
                  type: string
                  description: Username for login
                  example: Maria
                  pattern: "^[a-zA-Z0-9_]{3,16}$"
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                description: Authentication token
                properties:
                  identifier:
                    type: string
                    description: Authentication token
                    example: abcdef012345
                    pattern: "^[A-Za-z0-9-_]{1,64}$"
                    minLength: 1
                    maxLength: 64
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []

  /users/me/name:
    put:
      tags:
        - User
      summary: Update username
      description: Change authenticated user's display name
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: New username request
              required:
                - name
              properties:
                name:
                  type: string
                  description: New username
                  pattern: "^[a-zA-Z0-9_]{3,16}$"
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: Name updated successfully
          content:
            application/json:
              schema:
                type: object
                description: Updated name details
                properties:
                  name:
                    type: string
                    description: Updated username
                    pattern: "^[a-zA-Z0-9_]{3,16}$"
                    minLength: 3
                    maxLength: 16
        '409':
          description: Name already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/photo:
    put:
      tags:
        - User
      summary: Update profile photo
      description: Change authenticated user's profile picture
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              description: New profile photo
              format: binary
              minLength: 1
              maxLength: 100000000
      responses:
        '200':
          description: Photo updated successfully
          content:
            application/json:
              schema:
                type: object
                description: Updated photo details
                properties:
                  photoUrl:
                    type: string
                    description: URL of the updated photo
                    pattern: '^https?://[^\s/$.?#].[^\s]*$'
                    minLength: 1
                    maxLength: 255

  /users/search:
    get:
      tags:
        - User
      summary: Search users
      description: Search for users by username
      parameters:
        - name: q
          in: query
          description: Username search query
          schema:
            type: string
            description: Query string
            pattern: "^[a-zA-Z0-9_]{1,16}$"
            minLength: 1
            maxLength: 16
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                description: List of found conversations/users
                items:
                  $ref: '#/components/schemas/Conversation'
                minItems: 0
                maxItems: 100
  
  /conversations:
    get:
      tags:
        - Conversations
      summary: List user conversations
      description: Get all conversations for authenticated user
      operationId: getMyConversations
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                description: List of conversations
                items:
                  $ref: '#/components/schemas/Conversation'
                minItems: 1
                maxItems: 1000
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        description: Unique conversation identifier
        required: true
        schema:
          type: string
          format: uuid
          description: Conversation UUID
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
    get:
      tags:
        - Conversations
      summary: Get conversation details
      description: Get conversation info and message history
      operationId: getConversation
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                type: object
                description: Get Conversation details
                required:
                  - messages
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
                  messages:
                    type: array
                    description: List of messages in conversation
                    items:
                      $ref: '#/components/schemas/Message'
                    minItems: 1
                    maxItems: 5000
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        description: Unique conversation identifier
        required: true
        schema:
          type: string
          format: uuid
          description: Conversation UUID
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
    post:
      tags:
        - Messages
      summary: Send message
      description: Send new message to conversation. If no conversationId is provided (e.g. UUID-like user ID), creates new conversation.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Message details
              required:
                - content
                - type
              properties:
                content:
                  type: string
                  description: Message content
                  pattern: "^.{1,1000}$"
                  minLength: 1
                  maxLength: 10000000
                type:
                  type: string
                  description: Message type
                  enum:
                    - text
                    - photo
                  minLength: 1
                  maxLength: 10
                recipientName:
                  type: string
                  description: Username of recipient (required only for first message in new individual chat)
                  pattern: "^[a-zA-Z0-9_]{3,16}$"
                  minLength: 3
                  maxLength: 32
                groupName:
                  type: string
                  description: Group name (required only for creating new group chat)
                  pattern: "^[^\n]{1,50}$"
                  minLength: 1
                  maxLength: 50
                members:
                  type: array
                  description: List of usernames to add to group (required only for creating new group chat)
                  minItems: 2
                  maxItems: 100
                  items:
                    type: string
                    description: Username
                    pattern: "^[a-zA-Z0-9_]{3,16}$"
                    minLength: 3
                    maxLength: 32
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        description: Unique identifier of the message
        required: true
        schema:
          type: string
          format: uuid
          description: Message UUID
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
    delete:
      tags:
        - Messages
      summary: Delete a message
      description: Removes a message sent by the authenticated user
      operationId: deleteMessage
      responses:
        '200':
          description: Message deleted successfully
          content:
            application/json:
              schema:
                type: object
                description: Delete operation result
                properties:
                  success:
                    type: boolean
                    description: Whether the deletion was successful

  /messages/{messageId}/forward:
    parameters:
      - name: messageId
        in: path
        description: Unique identifier of the message
        required: true
        schema:
          type: string
          format: uuid
          description: Message UUID
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
    post:
      tags:
        - Messages
      summary: Forward a message
      description: Forwards an existing message to another conversation
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Forward message request
              required:
                - conversationId
              properties:
                conversationId:
                  type: string
                  description: Target conversation identifier
                  format: uuid
                  pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
                  minLength: 36
                  maxLength: 36
      responses:
        '201':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /messages/{messageId}/reactions:
    parameters:
      - name: messageId
        in: path
        description: Unique identifier of the message
        required: true
        schema:
          type: string
          format: uuid
          description: Message UUID
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
    post:
      tags:
        - Messages
      summary: Add a reaction to a message
      description: Adds an emoji reaction to a message
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Reaction details
              required:
                - emoji
              properties:
                emoji:
                  type: string
                  description: Emoji character to react with
                  pattern: '(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])'
                  minLength: 1
                  maxLength: 2
      responses:
        '201':
          description: Reaction added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
  /messages/{messageId}/reactions/{reactionId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
      - name: reactionId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"  
          minLength: 36
          maxLength: 36
    delete:
      tags:
        - Messages
      summary: Remove a reaction from a message
      description: Removes user's emoji reaction from a message
      operationId: uncommentMessage
      responses:
        '204':
          description: Reaction removed successfully

  /groups/{groupId}/leave:
    parameters:
      - $ref: '#/components/parameters/groupId'
    post:
      tags:
        - Groups
      summary: Leave a group
      description: Removes authenticated user from a group
      operationId: leaveGroup
      responses:
        '200':
          description: Successfully left the group
          content:
            application/json:
              schema:
                type: object
                description: Leave group result
                properties:
                  success:
                    type: boolean
                    description: Whether the user left successfully

  /groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        description: Unique identifier of the group
        required: true
        schema:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          minLength: 36
          maxLength: 36
    post:
      tags:
        - Groups
      summary: Add a user to a group
      description: Adds new member to a group conversation
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: New member details
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: Identifier of user to add
                  format: uuid
                  pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
                  minLength: 36
                  maxLength: 36
      responses:
        '200':
          description: User added to group successfully
          content:
            application/json:
              schema:
                type: object
                description: Add member result
                properties:
                  success:
                    type: boolean
                    description: Whether the user was added successfully

  /groups/{groupId}/name:
    parameters:
      - $ref: '#/components/parameters/groupId'
    put:
      tags:
        - Groups
      summary: Update group name
      description: Changes the display name of a group
      operationId: setGroupName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Group name update request
              required:
                - name
              properties:
                name:
                  type: string
                  description: New name for the group
                  pattern: "^[^\n]{1,50}$"
                  minLength: 1
                  maxLength: 50
      responses:
        '200':
          description: Group name updated successfully
          content:
            application/json:
              schema:
                type: object
                description: Updated group details
                properties:
                  name:
                    type: string
                    description: New group name
                    pattern: "^[^\n]{1,50}$"
                    minLength: 1
                    maxLength: 50

  /groups/{groupId}/photo:
    parameters:
      - $ref: '#/components/parameters/groupId'
    put:
      tags:
        - Groups
      summary: Update group photo
      description: Changes the photo of a group
      operationId: setGroupPhoto
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              description: New photo for the group
              format: binary
              minLength: 1
              maxLength: 100000000
      responses:
        '200':
          description: Group photo updated successfully
          content:
            application/json:
              schema:
                type: object
                description: Updated photo details
                properties:
                  photoUrl:
                    type: string
                    description: URL of the updated photo
                    pattern: '^https?://[^\s/$.?#].[^\s]*$'
                    minLength: 1
                    maxLength: 255
  
  /start-conversation:
    post:
      tags:
        - Conversations
      summary: Start conversation helper
      description: Additional endpoint for UI to start conversations easily
      operationId: startConversation
      requestBody:
         description: Conversation details
         content:
           application/json:
             schema:
               type: object
               description: Start conversation request
               properties:
                 name:
                   type: string
                   description: Group Name
                   pattern: "^[^\n]{1,50}$"
                   minLength: 1
                   maxLength: 50
                 members:
                   type: array
                   description: List of members
                   items:
                     type: string
                     description: Username
                     pattern: "^[a-zA-Z0-9_]{3,16}$"
                     minLength: 3
                     maxLength: 16
                   minItems: 1
                   maxItems: 100
      responses:
        '201':
          description: Created conversation
  
  /liveness:
    get:
      tags:
        - System
      summary: Check system liveness
      description: Returns 200 OK if system is up
      operationId: checkLiveness
      responses:
        '200':
          description: System is online

security:
  - bearerAuth: []
